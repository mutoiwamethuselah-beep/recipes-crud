<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recipe Cards – CRUD App</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #1f4e79; color: #fff; padding: 16px 20px; }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 4px 0 0; font-size: .85rem; opacity: .85; }
    main { max-width: 1000px; margin: 20px auto; padding: 0 12px; }
    section { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    h2 { margin-top: 0; font-size: 1.1rem; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    form .full { grid-column: 1 / -1; }
    label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 4px; }
    input, textarea, select { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
    textarea { min-height: 70px; resize: vertical; }
    button { padding: 8px 14px; border: 0; border-radius: 4px; cursor: pointer; font: inherit; }
    .primary { background: #1f4e79; color: #fff; }
    .secondary { background: #ddd; }
    .edit { background: #e8a317; color: #000; padding: 4px 10px; }
    .del { background: #c0392b; color: #fff; padding: 4px 10px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3e3e3; vertical-align: top; }
    th { background: #f0f3f6; }
    #message { padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; display: none; }
    #message.ok { display: block; background: #d4edda; color: #155724; }
    #message.err { display: block; background: #f8d7da; color: #721c24; }
    @media (max-width: 600px) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Personal Recipe Card</h1>
    <p>Single-table CRUD app – Node.js + Express + SQLite</p>
  </header>

  <main>
    <section>
      <h2 id="formTitle">Add a new recipe</h2>
      <div id="message"></div>
      <form id="recipeForm">
        <input type="hidden" id="recipeId" />
        <div>
          <label for="title">Title *</label>
          <input id="title" required maxlength="150" />
        </div>
        <div>
          <label for="category">Category</label>
          <select id="category">
            <option value="">-- choose --</option>
            <option>Breakfast</option><option>Starter</option><option>Main</option>
            <option>Side</option><option>Snack</option><option>Dessert</option>
          </select>
        </div>
        <div>
          <label for="prep_time_minutes">Prep time (minutes)</label>
          <input id="prep_time_minutes" type="number" min="0" />
        </div>
        <div>
          <label for="servings">Servings</label>
          <input id="servings" type="number" min="1" />
        </div>
        <div class="full">
          <label for="ingredients">Ingredients</label>
          <textarea id="ingredients"></textarea>
        </div>
        <div class="full">
          <label for="instructions">Instructions</label>
          <textarea id="instructions"></textarea>
        </div>
        <div class="full">
          <button type="submit" class="primary" id="saveBtn">Save recipe</button>
          <button type="button" class="secondary" id="cancelBtn" style="display:none">Cancel edit</button>
        </div>
      </form>
    </section>

    <section>
      <h2>All recipes</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Title</th><th>Category</th><th>Prep (min)</th><th>Servings</th><th>Updated</th><th>Actions</th></tr>
          </thead>
          <tbody id="recipeBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
